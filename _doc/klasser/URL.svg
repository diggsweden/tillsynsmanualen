<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 180">
  <g id="URL">
    <g fill="none">
      <rect x="0.5" y="0.5" width="129" height="172"/>
      <line x1="1" y1="12"  x2="130" y2="12"/>
      <line x1="1" y1="132"  x2="130" y2="132"/>
    </g>

    <g stroke="none">
      <text x="65" y="10" font-size="1.125em" font-weight="bold" text-anchor="middle">URL</text>
      <text x="5" y="20">+hash: string</text>
      <text x="5" y="30">+host: string</text>
      <text x="5" y="40">+hostname: string</text>
      <text x="5" y="50">+href: string</text>
      <text x="5" y="60">+origin: string</text>
      <text x="5" y="70">+password: string</text>
      <text x="5" y="80">+pathnam: string</text>
      <text x="5" y="90">+port: string</text>
      <text x="5" y="100">+protocol: string</text>
      <text x="5" y="110">+search: string</text>
      <text x="5" y="120">+searchParams: URLSearchParams</text>
      <text x="5" y="130">+username: string</text>
      <text x="5" y="140">createObjectURL(object): string</text>
      <text x="5" y="150">revokeObjectURL(string): void</text>
      <text x="5" y="160">toJSON(): string</text>
      <text x="5" y="170">toString(): string</text>
    </g>
  </g>
</svg>
