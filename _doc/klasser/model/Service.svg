<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60">
  <g id="Service-no-details">
    <g fill="none">
      <rect x="0.5" y="0.5" width="99" height="52"/>
      <line x1="1" y1="12" x2="100" y2="12"/>
      <line x1="1" y1="32" x2="100" y2="32"/>
    </g>

    <g stroke="none">
      <text x="50" y="10" font-size="1.125em" font-weight="bold" text-anchor="middle">Service</text>
      <text x="5" y="20">+authentication</text>
      <text x="5" y="30">+name</text>
      <text x="5" y="40">serialize()</text>
      <text x="5" y="50">toJSON()</text>
    </g>
  </g>

  <g id="Service">
    <g fill="none">
      <rect x="0.5" y="0.5" width="99" height="52"/>
      <line x1="1" y1="12" x2="100" y2="12"/>
      <line x1="1" y1="32" x2="100" y2="32"/>
    </g>

    <g stroke="none">
      <text x="50" y="10" font-size="1.125em" font-weight="bold" text-anchor="middle">Service</text>
      <text x="5" y="20">+authentication: boolean</text>
      <text x="5" y="30">+name: string</text>
      <text x="5" y="40">serialize(): string</text>
      <text x="5" y="50">toJSON(): object</text>
    </g>
  </g>
</svg>
