<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 120">
  <g id="Schedule">
    <g fill="none">
      <rect x="0.5" y="0.5" width="109" height="112"/>
      <line x1="1" y1="12" x2="110" y2="12"/>
      <line x1="1" y1="82" x2="110" y2="82"/>
    </g>

    <g stroke="none">
      <text x="55" y="10" font-size="1.125em" font-weight="bold" text-anchor="middle">Schedule</text>
      <text x="5" y="20">+begins: date</text>
      <text x="5" y="30">+caseNumber: CaseNumber</text>
      <text x="5" y="40">+date: date</text>
      <text x="5" y="50">+ends: date</text>
      <text x="5" y="60">+id: number</text>
      <text x="5" y="70">+period: string</text>
      <text x="5" y="80">+supervisor: Person</text>
      <text x="5" y="90">serialize(): object</text>
      <text x="5" y="100">toJSON(): object</text>
      <text x="5" y="110">toString(): string</text>
    </g>
  </g>
</svg>
