<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 160">
  <g id="Check-no-details">
    <g fill="none">
      <rect x="0.5" y="0.5" width="99" height="152"/>
      <line x1="1" y1="12"  x2="100" y2="12"/>
      <line x1="1" y1="102" x2="100" y2="102"/>
    </g>

    <g stroke="none">
      <text x="50" y="10" font-size="1.125em" font-weight="bold" text-anchor="middle">Check</text>
      <text x="5" y="20">+applicable</text>
      <text x="5" y="30">+cardinality</text>
      <text x="5" y="40">+disabled</text>
      <text x="5" y="50">+done</text>
      <text x="5" y="60">+failed</text>
      <text x="5" y="70">+id</text>
      <text x="5" y="80">+observation</text>
      <text x="5" y="90">+screenshot</text>
      <text x="5" y="100">+state</text>
      <text x="5" y="110">controlledBy()</text>
      <text x="5" y="120">serialize()</text>
      <text x="5" y="130">setScreenshot()</text>
      <text x="5" y="140">toJSON()</text>
      <text x="5" y="150">toString()</text>
    </g>
  </g>

  <g id="Check">
    <g fill="none">
      <rect x="0.5" y="0.5" width="129" height="152"/>
      <line x1="1" y1="12"  x2="130" y2="12"/>
      <line x1="1" y1="102" x2="130" y2="102"/>
    </g>

    <g stroke="none">
      <text x="65" y="10" font-size="1.125em" font-weight="bold" text-anchor="middle">Check</text>
      <text x="5" y="20">+applicable: boolean</text>
      <text x="5" y="30">+cardinality: number</text>
      <text x="5" y="40">+disabled: boolean</text>
      <text x="5" y="50">+done: boolean</text>
      <text x="5" y="60">+failed: boolean</text>
      <text x="5" y="70">+id: string</text>
      <text x="5" y="80">+observation: string</text>
      <text x="5" y="90">+screenshot: object</text>
      <text x="5" y="100">+state: boolean</text>
      <text x="5" y="110">controlledBy(Check, boolean): void</text>
      <text x="5" y="120">serialize(): object</text>
      <text x="5" y="130">setScreenshot(string, string): void</text>
      <text x="5" y="140">toJSON(): object</text>
      <text x="5" y="150">toString(): string</text>
    </g>
  </g>
</svg>
