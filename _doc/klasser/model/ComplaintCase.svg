<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 70">
  <g id="ComplaintCase-no-details">
    <g fill="none">
      <rect x="0.5" y="0.5" width="99" height="62"/>
      <line x1="1" y1="12" x2="100" y2="12"/>
      <line x1="1" y1="52" x2="100" y2="52"/>
    </g>

    <g stroke="none">
      <text x="50" y="10" font-size="1.125em" font-weight="bold" text-anchor="middle">ComplaintCase</text>
      <text x="5" y="20">+date</text>
      <text x="5" y="30">+monitoring</text>
      <text x="5" y="40">+sections</text>
      <text x="5" y="50">+supervisor</text>
      <text x="5" y="60">serialize()</text>
