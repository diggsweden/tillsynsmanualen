<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150">
  <g id="Person">
    <g fill="none">
      <rect x="0.5" y="0.5" width="99" height="142"/>
      <line x1="1" y1="12" x2="100" y2="12"/>
      <line x1="1" y1="82" x2="100" y2="82"/>
    </g>

    <g stroke="none">
      <text x="50" y="10" font-size="1.125em" font-weight="bold" text-anchor="middle">Person</text>
      <text x="5" y="20">+email: string</text>
      <text x="5" y="30">+familyName: string</text>
      <text x="5" y="40">+giveName: string</text>
      <text x="5" y="50">+id: number</text>
      <text x="5" y="60">+name: string</text>
      <text x="5" y="70">+roles: string[]</text>
      <text x="5" y="80">+telephone: string</text>
      <text x="5" y="90">addRole(string): void</text>
      <text x="5" y="100">deleteRole(string): void</text>
      <text x="5" y="110">hasRole(string): boolean</text>
      <text x="5" y="120">serialize(): object</text>
      <text x="5" y="130">toJSON(): object</text>
      <text x="5" y="140">toString(): string</text>
    </g>
  </g>
</svg>
