      <rect x="0.5" y="0.5" width="129" height="82"/>
      <line x1="1" y1="12" x2="130" y2="12"/>
      <line x1="1" y1="32" x2="130" y2="32"/>
    </g>

    <g stroke="none">
      <text x="65" y="10" font-size="1.125em" font-weight="bold" text-anchor="middle">Menubar</text>
      <text x="5" y="20">+current: MenuItem</text>
      <text x="5" y="30">+id: string</text>
