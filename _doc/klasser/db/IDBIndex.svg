<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <g id="IDBIndex">
    <g fill="none">
      <rect x="0.5" y="0.5" width="159" height="112"/>
      <line x1="1" y1="12" x2="160" y2="12"/>
      <line x1="1" y1="52" x2="160" y2="52"/>
    </g>

    <g stroke="none">
      <text x="80" y="10" font-size="1.125em" font-weight="bold" text-anchor="middle">IDBIndex</text>
