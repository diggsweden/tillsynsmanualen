      <text x="5" y="80">getAll([*] [,number]): IDBRequest</text>
      <text x="5" y="90">getAllKeys([*] [,number]): IDBRequest</text>
      <text x="5" y="100">openCursor([*] [,string]): IDBRequest</text>
