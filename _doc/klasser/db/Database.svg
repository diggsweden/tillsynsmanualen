      <rect x="0.5" y="0.5" width="199" height="52"/>
      <line x1="1" y1="12" x2="200" y2="12"/>
    </g>

    <g stroke="none">
      <text x="100" y="10" font-size="1.125em" font-weight="bold" text-anchor="middle">Database</text>
