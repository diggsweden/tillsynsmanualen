<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <g id="IDBCursor">
    <g fill="none">
      <rect x="0.5" y="0.5" width="119" height="112"/>
      <line x1="1" y1="12"  x2="120" y2="12"/>
      <line x1="1" y1="62"  x2="120" y2="62"/>
    </g>

    <g stroke="none">
      <text x="60" y="10" font-size="1.125em" font-weight="bold" text-anchor="middle">IDBCursor</text>
      <text x="5" y="20">+direction: string</text>
      <text x="5" y="30">+key: *</text>
      <text x="5" y="40">+primaryKey: *</text>
      <text x="5" y="50">+request: IDBRequeest</text>
      <text x="5" y="60">+source: IDBObjectStore</text>
      <text x="5" y="70">advance(number): void</text>
      <text x="5" y="80">continue([*]): void</text>
      <text x="5" y="90">continuePrimaryKey(*, *): void</text>
      <text x="5" y="100">delete(): IDBRequest</text>
      <text x="5" y="110">update(object): IDBRequest</text>
    </g>
  </g>
</svg>
