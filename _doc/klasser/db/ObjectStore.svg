<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 110">
  <g id="ObjectStore">
    <g fill="none">
      <rect x="0.5" y="0.5" width="139" height="102"/>
      <line x1="1" y1="12" x2="140" y2="12"/>
    </g>

    <g stroke="none">
      <text x="70" y="10" font-size="1.125em" font-weight="bold" text-anchor="middle">ObjectStore</text>
      <text x="5" y="20">add(object [,string]): promise</text>
      <text x="5" y="30">count([*]): promise</text>
      <text x="5" y="40">delete(*): promise</text>
      <text x="5" y="50">get(*): promise</text>
      <text x="5" y="60">getAll([*] [,number]): promise</text>
      <text x="5" y="70">index(string): Index</text>
      <text x="5" y="80">openCursor([*] [,string]): Cursor</text>
      <text x="5" y="90">openKeyCursor([*] [,string]): Cursor</text>
      <text x="5" y="100">put(object [,string]): promise</text>
    </g>
  </g>
</svg>
