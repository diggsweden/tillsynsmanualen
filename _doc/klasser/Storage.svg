<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 80">
  <g id="Storage">
    <g fill="none">
      <rect x="0.5" y="0.5" width="109" height="72"/>
      <line x1="1" y1="12"  x2="110" y2="12"/>
      <line x1="1" y1="22"  x2="110" y2="22"/>
    </g>

    <g stroke="none">
      <text x="55" y="10" font-size="1.125em" font-weight="bold" text-anchor="middle">Storage</text>
      <text x="5" y="20">+length: number</text>
      <text x="5" y="30">clear(): void</text>
      <text x="5" y="40">key(number): string</text>
      <text x="5" y="50">getItem(string): string</text>
      <text x="5" y="60">removeItem(string): void</text>
      <text x="5" y="70">setItem(string, string): void</text>
