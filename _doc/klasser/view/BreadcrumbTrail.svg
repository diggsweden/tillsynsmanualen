<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 120">
  <g id="BreadcrumbTrail">
    <g fill="none">
      <rect x="0.5" y="0.5" width="149" height="112"/>
      <line x1="1" y1="12" x2="150" y2="12"/>
      <line x1="1" y1="32" x2="150" y2="32"/>
    </g>

    <g stroke="none">
      <text x="75" y="10" font-size="1.125em" font-weight="bold" text-anchor="middle">BreadcrumbTrail</text>
      <text x="5" y="20">+current: string</text>
      <text x="5" y="30">+links: object[]</text>
      <text x="5" y="40">audit(number, date): void</text>
      <text x="5" y="50">case(number, string, string, string): void</text>
      <text x="5" y="60">complete(): promise</text>
      <text x="5" y="70">deleteRoot(): void</text>
      <text x="5" y="80">list(string, string): void</text>
      <text x="5" y="90">log(number): void</text>
      <text x="5" y="100">requirement(number, string): void</text>
      <text x="5" y="110">sample(number, string): void</text>
    </g>
  </g>
</svg>
