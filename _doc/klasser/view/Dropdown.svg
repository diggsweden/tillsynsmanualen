<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 70">
  <g id="Dropdown">
    <g fill="none">
      <rect x="0.5" y="0.5" width="199" height="62"/>
      <line x1="1" y1="12" x2="200" y2="12"/>
      <line x1="1" y1="22" x2="200" y2="22"/>
    </g>

    <g stroke="none">
      <text x="100" y="10" font-size="1.125em" font-weight="bold" text-anchor="middle">Dropdown</text>
      <text x="5" y="20">+buttonText: string</text>
      <text x="5" y="30">attach(HTMLButtonElement, HTMLUListElement): void</text>
      <text x="5" y="40">detach(): void</text>
      <text x="5" y="50">reset(string[]): void</text>
      <text x="5" y="60">subscribe(callback): void</text>
    </g>
  </g>
</svg>
