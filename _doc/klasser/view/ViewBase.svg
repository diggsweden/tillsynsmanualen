<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 190">
  <g id="ViewBase">
    <g fill="none">
      <rect x="0.5" y="0.5" width="129" height="182"/>
      <line x1="1" y1="12" x2="130" y2="12"/>
      <line x1="1" y1="62" x2="130" y2="62"/>
    </g>

    <g stroke="none">
      <text x="65" y="10" font-size="1.125em" font-weight="bold" text-anchor="middle">ViewBase</text>
      <text x="5" y="20">+action: string</text>
      <text x="5" y="30">+advancedMode: boolean</text>
      <text x="5" y="40">+breadcrumbs: BreadcrumbTrail</text>
      <text x="5" y="50">+busy: boolean</text>
      <text x="5" y="60">+title: string</text>
      <text x="5" y="70">activate(): void</text>
      <text x="5" y="80">audtoFocus(): void</text>
      <text x="5" y="90">close(): void</text>
      <text x="5" y="100">confirm(…): promise</text>
      <text x="5" y="110">deactivate(): void</text>
      <text x="5" y="120">hideStatus(): void</text>
      <text x="5" y="130">open(): promise</text>
      <text x="5" y="140">showError(string): void</text>
      <text x="5" y="150">showStatus(string [, string]): void</text>
      <text x="5" y="160">showSuccess(string): void</text>
      <text x="5" y="170">subscribe(callback): void</text>
      <text x="5" y="180">unsubscribe(callback): void</text>
    </g>
  </g>
</svg>
