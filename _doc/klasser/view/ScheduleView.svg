<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g id="ScheduleView">
    <g fill="none">
      <rect x="0.5" y="0.5" width="99" height="92"/>
      <line x1="1" y1="12" x2="100" y2="12"/>
      <line x1="1" y1="82" x2="100" y2="82"/>
    </g>

    <g stroke="none">
      <text x="50" y="10" font-size="1.125em" font-weight="bold" text-anchor="middle">ScheduleView</text>
      <text x="5" y="20">+begins: date</text>
      <text x="5" y="30">+caseNumber: string</text>
      <text x="5" y="40">+date: date</text>
      <text x="5" y="50">+ends: date</text>
      <text x="5" y="60">+maxDate: date</text>
      <text x="5" y="70">+supervisor: string</text>
      <text x="5" y="80">+supervisors: object[]</text>
      <text x="5" y="90">disableRemove(): void</text>
    </g>
  </g>
</svg>
