      <line x1="1" y1="12" x2="110" y2="12"/>
    </g>

    <g stroke="none">
      <text x="55" y="10" font-size="1.125em" font-weight="bold" text-anchor="middle">WAVEContainer</text>
      <text x="5" y="20">absent(…): WAVEContainer</text>
      <text x="5" y="30">present(…): WAVEContainer</text>
      <text x="5" y="40">tab(string): WAVEContainer</text>
