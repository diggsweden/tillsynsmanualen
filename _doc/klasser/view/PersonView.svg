<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80">
  <g id="PersonView">
    <g fill="none">
      <rect x="0.5" y="0.5" width="99" height="72"/>
      <line x1="1" y1="12" x2="100" y2="12"/>
      <line x1="1" y1="62" x2="100" y2="62"/>
    </g>

    <g stroke="none">
      <text x="50" y="10" font-size="1.125em" font-weight="bold" text-anchor="middle">PersonView</text>
      <text x="5" y="20">+email: string</text>
      <text x="5" y="30">+familyName: string</text>
      <text x="5" y="40">+givenName: string</text>
      <text x="5" y="50">+roles: string[]</text>
      <text x="5" y="60">+telephone: string</text>
