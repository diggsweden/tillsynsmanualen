<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 70">
  <g id="SettingStorage">
    <g fill="none">
      <rect x="0.5" y="0.5" width="99" height="62"/>
      <line x1="1" y1="12"  x2="100" y2="12"/>
    </g>

    <g stroke="none">
      <text x="50" y="10" font-size="1.125em" font-weight="bold" text-anchor="middle">SettingStorage</text>
      <text x="5" y="20">clear(): void</text>
      <text x="5" y="30">contains(...string): boolean</text>
      <text x="5" y="40">read(string): string</text>
      <text x="5" y="50">remove(string): void</text>
      <text x="5" y="60">write(string, string): void</text>
    </g>
