<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 90">
  <g id="RequirementOrder">
    <g fill="none">
      <rect x="0.5" y="0.5" width="99" height="82"/>
      <line x1="1" y1="12" x2="100" y2="12"/>
    </g>

    <g stroke="none">
      <text x="50" y="10" font-size="1.125em" font-weight="bold" text-anchor="middle">RequirementOrder</text>
      <text x="5" y="20">[@@iterator](): iterable</text>
      <text x="5" y="30">build(Sample): object</text>
      <text x="5" y="40">next(string): string</text>
      <text x="5" y="50">previous(string): string</text>
      <text x="5" y="60">section(object): iterator</text>
      <text x="5" y="70">sectionless(): iterator</text>
      <text x="5" y="80">skip(string): string</text>
    </g>
  </g>
</svg>
