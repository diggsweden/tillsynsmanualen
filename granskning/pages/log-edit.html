<h1 id="start-of-content">Ärendenotering</h1>

<p aria-hidden="true" class="req">
  Obligatoriska fält har tjockare kantlinje och ledtexten är fet och följs av en
  asterisk (<samp>*</samp>).
</p>

<form autocomplete="off">
  <p>
    <label>
      <em>Datum och klockslag</em>
      <input name="timestamp" type="datetime-local" required />
    </label>
  </p>

  <p class="multiple">
    <span>
      <label>
        <em>Händelsetyp</em>
        <select name="type" required>
          <option value="">(välj)</option>
          <option value="deferment">Anståndsansökan</option>
          <option value="notification">Avisering om granskning</option>
          <option value="letter">Brev</option>
          <option value="email">E-brev</option>
          <option value="injunction">Föreläggande</option>
          <option value="finish audit">Granskning avslutad</option>
          <option value="start audit">Granskning påbörjad</option>
          <option value="minutes">Mötesanteckningar</option>
          <option value="remarks">Påpekande</option>
          <option value="telephone">Telefonsamtal</option>
          <option value="note">Tjänsteanteckning</option>
          <option value="open case">Ärende öppnat</option>
          <option value="appeal">Överklagande</option>
          <option value="other">Övrigt</option>
        </select>
      </label>
    </span>

    <span>
      <label>
        <em>Riktning</em>
        <select name="direction" required>
          <option value="">(välj)</option>
          <option value="received">Inkommet till myndigheten</option>
          <option value="internal">Intern anteckning</option>
          <option value="sent">Skickat från myndigheten</option>
        </select>
      </label>
    </span>
  </p>

  <p>
    <label>
      <em>Sammanfattning</em>
      <input name="summary" type="text" required />
    </label>
  </p>

  <p>
    <label>
      <span>Granskning</span>
      <select name="data">
        <option value="">(välj)</option>
      </select>
    </label>
  </p>

  <p>
    <label>
      Detaljer
      <textarea name="text"></textarea>
    </label>
  </p>

  <p>
    <button value="save" accesskey="s" data-action="save">
      <svg aria-hidden="true">
        <use xlink:href="../img/ikoner.svg#ico-save" />
      </svg>
      Spara
    </button>

    <button formnovalidate value="delete" data-action="delete" class="button">
      <svg aria-hidden="true">
        <use xlink:href="../img/ikoner.svg#ico-delete" />
      </svg>
      Ta bort
    </button>
  </p>
</form>

<dialog
  role="alertdialog"
  aria-atomic="true"
  ,
  aria-labelledby="confirm-label"
  aria-modal="true"
  id="confirm-dialog"
>
  <h2 id="confirmm-label">Bekräfta borttag</h2>
  <p class="prompt"></p>

  <p>
    <button data-handler="confirm" type="button" value="false">
      <svg aria-hidden="true">
        <use xlink:href="../img/ikoner.svg#ico-cancel" />
      </svg>
      Avbryt
    </button>

    <button data-handler="confirm" type="button" value="true">OK</button>
  </p>
</dialog>
